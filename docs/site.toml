# SDL3 bindings documentation site — built with juicer, juicerdocs theme.
#
# Local preview:  cd /Users/ed/dev/juicer && sbt 'juicerJVM/run serve -s /Users/ed/dev/sdl3/docs -L'
# Build:          cd /Users/ed/dev/juicer && sbt 'juicerJVM/run build --source /Users/ed/dev/sdl3/docs'

title       = "SDL3 for Scala Native"
author      = "Ed Maxedon"
baseURL     = "https://sdl3.edadma.dev/"
description = "Scala Native bindings for SDL3 — 2D rendering, input, text, images, and audio."

# Drives the topbar GitHub icon and the homepage hero "Star on GitHub" button.
repoURL = "https://github.com/edadma/sdl3"

theme = "juicerdocs"

# The page <h1> comes from frontmatter title — markdown headings start at h2.
headingShift = 0

# Static hosts serve the on-disk layout literally, so the URL space must match
# the file tree. Force htmlDir off so URLs and paths agree on deploy.
htmlDir = ""

# Recompile the theme CSS from SCSS and bundle/minify the theme JS on every build
# (fingerprinted for cache-busting). Degrades to a verbatim copy when sass/esbuild
# aren't on PATH, so the page still renders.
[assets]
enabled     = true
fingerprint = true

[[assets.sass]]
input  = "themes/juicerdocs/src/scss/juicerdocs.scss"
output = "/juicerdocs.css"
minify = true

[[assets.esbuild]]
input  = "themes/juicerdocs/static/juicerdocs.js"
output = "/juicerdocs.js"
minify = true

[juicerdocs]
version    = "v0.2.11"
getStarted = true

# Amber palette (distinct from riposte's teal). Light mode.
brand           = "#e8590c"        # orange-9 — links, button fills, hero gradient start
brandStrong     = "#d9480f"        # orange-10 — hover state
brandSoft       = "#ffe8cc"        # orange-1 — soft tint: sidebar hover, badges
accent          = "#f76707"        # orange-8 — hero gradient end, decorative highlights

# Dark-mode overrides (lighter, as dark surfaces need more luminance).
brandDark       = "#ffa94d"        # orange-4
brandStrongDark = "#ffc078"        # orange-3
brandSoftDark   = "rgb(232 89 12 / .16)"
accentDark      = "#ff922b"        # orange-5
